<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NanoPrompt Scratchpad</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0a0c10;
      --bg-card: #11151d;
      --border-subtle: #232936;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --accent-acid: #ccff00;
    }
    
    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      margin: 0;
      padding: 16px;
      width: 400px;
    }
    
    .header {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    h1 {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-primary);
    }
    
    .status-badge {
      font-size: 9px;
      padding: 2px 6px;
      background: rgba(204, 255, 0, 0.1);
      color: var(--accent-acid);
      border: 1px solid rgba(204, 255, 0, 0.3);
      border-radius: 2px;
    }
    
    .workspace {
      margin-bottom: 12px;
    }
    
    textarea {
      width: 100%;
      height: 180px;
      box-sizing: border-box;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.4;
      border-radius: 2px;
      outline: none;
      resize: none;
    }
    
    textarea:focus {
      border-color: rgba(204, 255, 0, 0.5);
    }

    textarea::placeholder {
      color: #374151;
    }
    
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    select {
      background-color: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 2px;
      padding: 8px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      cursor: pointer;
      flex: 1;
      outline: none;
    }

    select:focus {
      border-color: var(--accent-acid);
      color: var(--accent-acid);
    }

    .btn-primary {
      flex: 2;
      background: var(--accent-acid);
      color: var(--bg-base);
      border: none;
      padding: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s ease;
    }
    
    .btn-primary:hover {
      background: #ffffff;
    }
    
    .btn-primary.loading {
      background: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      cursor: not-allowed;
    }

    .btn-copy {
      flex: 1;
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      padding: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s ease;
      display: none;
    }

    .btn-copy:hover {
      border-color: var(--accent-acid);
      color: var(--accent-acid);
    }

    .settings-section {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .settings-section input {
      flex: 1;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      padding: 4px;
      outline: none;
    }
    .settings-section input:focus {
      border-color: var(--border-subtle);
      color: var(--text-primary);
    }

    .btn-save-settings {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 4px 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      cursor: pointer;
    }

    .toast {
      text-align: center;
      font-size: 10px;
      color: var(--accent-acid);
      margin-bottom: 12px;
      min-height: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>NanoPrompt</h1>
    <span class="status-badge">SCRATCHPAD</span>
  </div>
  
  <div class="workspace">
    <textarea id="promptInput" placeholder="Paste your massive block of code or text here..."></textarea>
  </div>
  
  <div class="toast" id="statsToast"></div>

  <div class="controls">
    <select id="typeSelect">
      <option value="auto">AUTO</option>
      <option value="code">CODE</option>
      <option value="text">TEXT</option>
      <option value="json">JSON</option>
    </select>
    <button id="compressBtn" class="btn-primary">⚡ COMPRESS</button>
    <button id="copyBtn" class="btn-copy">📋 COPY</button>
  </div>
  
  <div class="settings-section">
    <input type="text" id="apiUrl" placeholder="Backend API URL" />
    <button id="saveBtn" class="btn-save-settings">SAVE</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
